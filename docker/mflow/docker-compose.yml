version: "3.9"

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

  training:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    container_name: isic2024-training
    depends_on:
      - mlflow
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../Multimodal/data:/app/Multimodal/data
      - ../Multimodal/final:/app/Multimodal/final

  serving:
    build:
      context: ..
      dockerfile: docker/Dockerfile.serving
    container_name: isic2024-serving
    ports:
      - "8000:8000"
    volumes:
      - ../Multimodal/final:/app/Multimodal/final
    depends_on:
      - training

volumes:
  mlflow-data:
