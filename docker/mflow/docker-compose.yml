# ============================================================
# docker-compose.yml
# ============================================================
# ISIC 2024 Multimodal MLOps stack:
#
#   Services
#   ────────
#   mlflow         – MLflow tracking + model registry (port 5000)
#   preprocessing  – HDF5 extraction + tabular feature engineering
#   training       – Two-phase EfficientNetB3 training (GPU)
#   serving        – FastAPI inference API (port 8080)
#
#   Volumes
#   ───────
#   data     – raw ISIC 2024 dataset (CSV + HDF5)
#   models   – saved Keras models + preprocessors
#   mlruns   – MLflow artefacts
#
# Usage
# ──────
#   docker compose up mlflow                         # start tracker
#   docker compose run --rm preprocessing            # extract + preprocess
#   docker compose run --rm training                 # train
#   docker compose up serving                        # start API
# ============================================================

version: "3.9"

networks:
  isic_net:
    driver: bridge

volumes:
  data:
  models:
  mlruns:
  postgres_data:

services:
  # ── MLflow tracking server ──────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       mlflow
      POSTGRES_USER:     mlflow
      POSTGRES_PASSWORD: mlflow_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [isic_net]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:mlflow_secret@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlruns
    volumes:
      - mlruns:/mlruns
    networks: [isic_net]
    command: >
      mlflow server
        --backend-store-uri postgresql://mlflow:mlflow_secret@postgres:5432/mlflow
        --default-artifact-root /mlruns
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Stage 1 : Preprocessing ─────────────────────────────────────────────
  preprocessing:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.preprocessing
    environment:
      CSV_PATH:   /data/train-metadata.csv
      HDF5_PATH:  /data/train-image.hdf5
      IMAGE_DIR:  /data/images
      OUTPUT_DIR: /data/processed
      N_BENIGN:   "4000"
    volumes:
      - data:/data
    networks: [isic_net]
    profiles: ["preprocessing"]

  # ── Stage 2 : Training ──────────────────────────────────────────────────
  training:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.training
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      CSV_PATH:            /data/train-metadata.csv
      HDF5_PATH:           /data/train-image.hdf5
      IMAGE_DIR:           /data/images
      OUTPUT_DIR:          /models
      EXPERIMENT_NAME:     isic2024_efficientnetb3
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PHASE1_EPOCHS:       "15"
      PHASE2_EPOCHS:       "15"
      BATCH_SIZE:          "32"
      OVERSAMPLE_RATIO:    "0.25"
      N_BENIGN:            "4000"
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
    volumes:
      - data:/data
      - models:/models
      - mlruns:/mlruns
    networks: [isic_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["training"]

  # ── Stage 3 : Serving ───────────────────────────────────────────────────
  serving:
    build:
      context: ..
      dockerfile: Docker/Dockerfile.serving
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MODEL_PATH:          /models/multimodal_model.keras
      PREPROCESSORS_PATH:  /models/preprocessors.pkl
      THRESHOLD:           "0.55"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - models:/models
    networks: [isic_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    profiles: ["serving"]
