version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# MLflow Infrastructure Stack
# Services: PostgreSQL (backend store) + MinIO (artifact store) + MLflow Server
# Usage:
#   docker-compose -f docker/mlflow/docker-compose.yml up -d
#   UI → http://localhost:5000
#   MinIO console → http://localhost:9001  (admin / minioadmin)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL: MLflow metadata backend ──────────────────────────────────
  mlflow-postgres:
    image: postgres:15-alpine
    container_name: mlflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mlflow}
      POSTGRES_USER:     ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow_secret}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO: S3-compatible artifact store ──────────────────────────────────
  mlflow-minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - mlflow_minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init (runs once, then exits) ────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      mlflow-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://mlflow-minio:9000 $${MINIO_ROOT_USER:-admin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/mlflow-artifacts;
      mc anonymous set download myminio/mlflow-artifacts;
      echo 'MinIO bucket ready';
      "
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  # ── MLflow Tracking Server ───────────────────────────────────────────────
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow-server
    restart: unless-stopped
    depends_on:
      mlflow-postgres:
        condition: service_healthy
      mlflow-minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://mlflow-minio:9000
      AWS_ACCESS_KEY_ID:      ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY:  ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      mlflow server
        --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow_secret}@mlflow-postgres:5432/${POSTGRES_DB:-mlflow}
        --default-artifact-root s3://mlflow-artifacts/
        --host 0.0.0.0
        --port 5000
        --workers 2
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  mlflow_postgres_data:
  mlflow_minio_data:

networks:
  default:
    name: mlflow-network
