# ============================================================
# k8s-mlflow.yaml
# ============================================================
# Kubernetes manifests for ISIC 2024 MLOps stack:
#
#   Namespace   : isic2024
#   Deployments : mlflow-server, isic-serving
#   Jobs        : isic-preprocessing, isic-training
#   Services    : mlflow-svc (ClusterIP), serving-svc (LoadBalancer)
#   PVCs        : data-pvc, models-pvc, mlruns-pvc
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: isic2024
  labels:
    project: isic2024-multimodal

---
# ── Persistent Volume Claims ──────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: isic2024
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: isic2024
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlruns-pvc
  namespace: isic2024
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi

---
# ── MLflow Tracking Server ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: isic2024
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.11.0
          args:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:///mlruns/mlflow.db
            - --default-artifact-root
            - /mlruns
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: mlruns
              mountPath: /mlruns
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
      volumes:
        - name: mlruns
          persistentVolumeClaim:
            claimName: mlruns-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-svc
  namespace: isic2024
spec:
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

---
# ── Stage 1: Preprocessing Job ───────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: isic-preprocessing
  namespace: isic2024
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: preprocessing
          image: isic2024/preprocessing:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CSV_PATH
              value: /data/train-metadata.csv
            - name: HDF5_PATH
              value: /data/train-image.hdf5
            - name: IMAGE_DIR
              value: /data/images
            - name: OUTPUT_DIR
              value: /data/processed
            - name: N_BENIGN
              value: "4000"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc

---
# ── Stage 2: EfficientNetB3 Training Job (GPU) ───────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: isic-training
  namespace: isic2024
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: training
          image: isic2024/training:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CSV_PATH
              value: /data/train-metadata.csv
            - name: HDF5_PATH
              value: /data/train-image.hdf5
            - name: IMAGE_DIR
              value: /data/images
            - name: OUTPUT_DIR
              value: /models
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow-svc:5000
            - name: EXPERIMENT_NAME
              value: isic2024_efficientnetb3
            - name: PHASE1_EPOCHS
              value: "15"
            - name: PHASE2_EPOCHS
              value: "15"
            - name: BATCH_SIZE
              value: "32"
            - name: OVERSAMPLE_RATIO
              value: "0.25"
            - name: TF_FORCE_GPU_ALLOW_GROWTH
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /models
            - name: mlruns
              mountPath: /mlruns
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        - name: mlruns
          persistentVolumeClaim:
            claimName: mlruns-pvc
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

---
# ── Stage 3: Serving Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isic-serving
  namespace: isic2024
  labels:
    app: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: serving
  template:
    metadata:
      labels:
        app: serving
    spec:
      containers:
        - name: serving
          image: isic2024/serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PATH
              value: /models/multimodal_model.keras
            - name: PREPROCESSORS_PATH
              value: /models/preprocessors.pkl
            - name: THRESHOLD
              value: "0.55"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow-svc:5000
          volumeMounts:
            - name: models
              mountPath: /models
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: serving-svc
  namespace: isic2024
spec:
  selector:
    app: serving
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
