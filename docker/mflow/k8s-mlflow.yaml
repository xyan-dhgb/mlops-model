# ─────────────────────────────────────────────────────────────────────────────
# MLflow Infrastructure — Kubernetes Manifests (EKS)
# Namespace: mlops
# Components: Deployment + Service + ConfigMap + Secret
# Apply: kubectl apply -f docker/mlflow/k8s-mlflow.yaml
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: Namespace
metadata:
  name: mlops

---
# ── ConfigMap: non-sensitive config ──────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-config
  namespace: mlops
data:
  MLFLOW_S3_ENDPOINT_URL: "http://minio-service.mlops.svc.cluster.local:9000"
  POSTGRES_DB: "mlflow"
  POSTGRES_HOST: "postgres-service.mlops.svc.cluster.local"
  POSTGRES_PORT: "5432"
  MLFLOW_ARTIFACT_BUCKET: "s3://mlflow-artifacts/"

---
# ── Secret: sensitive credentials (base64 encoded) ───────────────────────────
# Generate: echo -n 'value' | base64
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secret
  namespace: mlops
type: Opaque
data:
  POSTGRES_USER:          bWxmbG93        # mlflow
  POSTGRES_PASSWORD:      bWxmbG93X3NlY3JldA==  # mlflow_secret
  AWS_ACCESS_KEY_ID:      YWRtaW4=       # admin
  AWS_SECRET_ACCESS_KEY:  bWluaW9hZG1pbg==  # minioadmin

---
# ── MLflow Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: mlops
  labels:
    app: mlflow-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-server
  template:
    metadata:
      labels:
        app: mlflow-server
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.13.0
          ports:
            - containerPort: 5000
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: MLFLOW_S3_ENDPOINT_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: POSTGRES_PASSWORD
          command:
            - mlflow
            - server
            - --backend-store-uri
            - "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - --default-artifact-root
            - "$(MLFLOW_ARTIFACT_BUCKET)"
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
            - --workers
            - "2"
          envFrom:
            - configMapRef:
                name: mlflow-config
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---
# ── MLflow Service (ClusterIP) ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops
  labels:
    app: mlflow-server
spec:
  type: ClusterIP
  selector:
    app: mlflow-server
  ports:
    - name: http
      port: 5000
      targetPort: 5000

---
