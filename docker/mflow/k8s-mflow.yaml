apiVersion: v1
kind: Namespace
metadata:
  name: mlops-isic2024

---
# ── PersistentVolume for MLflow artifacts ─────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-pvc
  namespace: mlops-isic2024
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# ── MLflow Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: mlops-isic2024
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.13.2
          ports:
            - containerPort: 5000
          args:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:////mlflow/mlflow.db
            - --default-artifact-root
            - /mlflow/artifacts
            - --host
            - "0.0.0.0"
            - --port
            - "5000"
          volumeMounts:
            - name: mlflow-storage
              mountPath: /mlflow
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-pvc

---
# ── MLflow Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
  namespace: mlops-isic2024
spec:
  selector:
    app: mlflow
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP

---
# ── Training Job ──────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: isic2024-training-job
  namespace: mlops-isic2024
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: trainer
          image: isic2024-training:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
          command: ["python", "scripts/run_train.py",
                    "--config", "Multimodal/config/train_config.yaml"]
          volumeMounts:
            - name: data-volume
              mountPath: /app/Multimodal/data
            - name: output-volume
              mountPath: /app/Multimodal/final
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: isic2024-data-pvc
        - name: output-volume
          persistentVolumeClaim:
            claimName: isic2024-output-pvc

---
# ── Serving Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isic2024-serving
  namespace: mlops-isic2024
  labels:
    app: isic2024-serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: isic2024-serving
  template:
    metadata:
      labels:
        app: isic2024-serving
    spec:
      containers:
        - name: serving
          image: isic2024-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/Multimodal/final/best_model.h5
            - name: PREPROCESSOR_PATH
              value: /app/Multimodal/final/preprocessor.pkl
          volumeMounts:
            - name: output-volume
              mountPath: /app/Multimodal/final
              readOnly: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: output-volume
          persistentVolumeClaim:
            claimName: isic2024-output-pvc

---
# ── Serving Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: isic2024-serving-service
  namespace: mlops-isic2024
spec:
  selector:
    app: isic2024-serving
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
