version: "3.9"

volumes:
  data_raw:
  data_processed:
  data_splits:
  data_model:
  data_output:
  data_eval:
  data_xai:

services:

  # ─── BƯỚC 1: Tải dataset ────────────────────────────────────────────
  prepare_data:
    build:
      context: ..
      dockerfile: Docker/01_prepare_data/Dockerfile
    volumes:
      - data_raw:/data/raw
    environment:
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
        - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
        - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
        - AWS_REGION=${AWS_REGION:-ap-southeast-1}
        - S3_INPUT_BUCKET=${S3_INPUT_BUCKET:-kltn-isic-2024-challenge}
        - S3_INPUT_PREFIX=${S3_INPUT_PREFIX:-isic-2024-challenge}
        - DATA_DIR=/data/raw

  # ─── BƯỚC 2a: Tiền xử lý ảnh ───────────────────────────────────────
  preprocess_image:
    build:
      context: ..
      dockerfile: Docker/02_preprocess/image/Dockerfile
    volumes:
      - data_raw:/data/raw:ro
      - data_processed:/data/processed
    environment:
      - RAW_DIR=/data/raw
      - PROCESSED_DIR=/data/processed
      - IMAGE_SIZE=224
      # - MAX_IMAGES=1000   # Bỏ comment khi test nhanh
    depends_on:
      - prepare_data

  # ─── BƯỚC 2b: Tiền xử lý CSV ───────────────────────────────────────
  preprocess_csv:
    build:
      context: ..
      dockerfile: Docker/02_preprocess/csv/Dockerfile
    volumes:
      - data_raw:/data/raw:ro
      - data_processed:/data/processed
    environment:
      - RAW_DIR=/data/raw
      - PROCESSED_DIR=/data/processed
    depends_on:
      - prepare_data

  # ─── BƯỚC 3: Phân chia dữ liệu ──────────────────────────────────────
  dataloader:
    build:
      context: ..
      dockerfile: Docker/03_dataloader/Dockerfile
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - RANDOM_SEED=42
    depends_on:
      - preprocess_image
      - preprocess_csv

  # ─── BƯỚC 4a: Xây dựng EfficientNetB3 branch ────────────────────────
  build_efficientnetB3:
    build:
      context: ..
      dockerfile: Docker/04_build_model/efficientnetB3/Dockerfile
    volumes:
      - data_processed:/data/processed:ro
      - data_model:/data/model
    environment:
      - PROCESSED_DIR=/data/processed
      - MODEL_DIR=/data/model
      - IMAGE_SIZE=224
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - dataloader

  # ─── BƯỚC 4b: Xây dựng MLP branch ───────────────────────────────────
  build_mlp:
    build:
      context: ..
      dockerfile: Docker/04_build_model/mlp/Dockerfile
    volumes:
      - data_processed:/data/processed:ro
      - data_model:/data/model
    environment:
      - PROCESSED_DIR=/data/processed
      - MODEL_DIR=/data/model
    depends_on:
      - dataloader

  # ─── BƯỚC 5: Huấn luyện ─────────────────────────────────────────────
  train:
    build:
      context: ..
      dockerfile: Docker/05_train/Dockerfile
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits:ro
      - data_model:/data/model
      - data_output:/data/output
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - MODEL_DIR=/data/model
      - OUTPUT_DIR=/data/output
      - PHASE1_EPOCHS=20
      - PHASE2_EPOCHS=10
      - BATCH_SIZE=32
      - OVERSAMPLE_RATIO=0.25
      - CLASS_WEIGHT_MAL=1.2
      - FINE_TUNE_FROM_LAYER=300
      - PHASE1_LR=0.001
      - PHASE2_LR=0.0001
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - build_efficientnetB3
      - build_mlp

  # ─── BƯỚC 6: Đánh giá ───────────────────────────────────────────────
  evaluate:
    build:
      context: ..
      dockerfile: Docker/06_evaluate/Dockerfile
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits:ro
      - data_output:/data/output:ro
      - data_eval:/data/eval
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - OUTPUT_DIR=/data/output
      - EVAL_DIR=/data/eval
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - train

  # ─── BƯỚC 7: XAI ────────────────────────────────────────────────────
  xai:
    build:
      context: ..
      dockerfile: Docker/07_xai/Dockerfile
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits:ro
      - data_output:/data/output:ro
      - data_eval:/data/eval:ro
      - data_xai:/data/xai
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - OUTPUT_DIR=/data/output
      - EVAL_DIR=/data/eval
      - XAI_DIR=/data/xai
      - NUM_GRADCAM_SAMPLES=20
      - NUM_SHAP_SAMPLES=100
      - SHAP_BACKGROUND=50
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - evaluate

  # ─── DRIFT MONITOR (chạy liên tục) ──────────────────────────────────
  drift_monitor:
    build:
      context: ..
      dockerfile: Docker/drift_monitor/Dockerfile
    volumes:
      - data_eval:/data/eval:ro
      - data_xai:/data/xai
    environment:
      - EVAL_DIR=/data/eval
      - PRODUCTION_LOG_DIR=/data/production_logs
      - DRIFT_REPORT_DIR=/data/xai/drift_reports
      - CHECK_INTERVAL_HOURS=24
      - PSI_THRESHOLD=0.25
      - KS_P_THRESHOLD=0.05
    restart: unless-stopped
