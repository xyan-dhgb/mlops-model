version: "3.9"

volumes:
  data_raw:
  data_processed:
  data_splits:
  data_model:
  data_output:
  data_eval:
  data_xai:

services:

  # ─── BƯỚC 1: Tải dataset ────────────────────────────────────────────
  prepare_data:
    build: ./01_prepare_data
    volumes:
      - data_raw:/data/raw
    environment:
      - GDRIVE_FILE_ID=${GDRIVE_FILE_ID}
      - DATA_DIR=/data/raw

  # ─── BƯỚC 2a: Tiền xử lý ảnh ───────────────────────────────────────
  preprocess_image:
    build: ./02_preprocess/image
    volumes:
      - data_raw:/data/raw:ro
      - data_processed:/data/processed
    environment:
      - RAW_DIR=/data/raw
      - PROCESSED_DIR=/data/processed
      - IMAGE_SIZE=224
      # - MAX_IMAGES=1000   # Bỏ comment khi test nhanh
    depends_on:
      - prepare_data

  # ─── BƯỚC 2b: Tiền xử lý CSV ───────────────────────────────────────
  preprocess_csv:
    build: ./02_preprocess/csv
    volumes:
      - data_raw:/data/raw:ro
      - data_processed:/data/processed
    environment:
      - RAW_DIR=/data/raw
      - PROCESSED_DIR=/data/processed
    depends_on:
      - prepare_data

  # ─── BƯỚC 3: Phân chia dữ liệu ──────────────────────────────────────
  dataloader:
    build: ./03_dataloader
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - RANDOM_SEED=42
    depends_on:
      - preprocess_image
      - preprocess_csv

  # ─── BƯỚC 4a: Xây dựng EfficientNetB3 branch ────────────────────────
  build_efficientnetB3:
    build: ./04_build_model/efficientnetB3
    volumes:
      - data_processed:/data/processed:ro
      - data_model:/data/model
    environment:
      - PROCESSED_DIR=/data/processed
      - MODEL_DIR=/data/model
      - IMAGE_SIZE=224
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - dataloader

  # ─── BƯỚC 4b: Xây dựng MLP branch ───────────────────────────────────
  build_mlp:
    build: ./04_build_model/mlp
    volumes:
      - data_processed:/data/processed:ro
      - data_model:/data/model
    environment:
      - PROCESSED_DIR=/data/processed
      - MODEL_DIR=/data/model
    depends_on:
      - dataloader

  # ─── BƯỚC 5: Huấn luyện ─────────────────────────────────────────────
  train:
    build: ./05_train
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits:ro
      - data_model:/data/model
      - data_output:/data/output
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - MODEL_DIR=/data/model
      - OUTPUT_DIR=/data/output
      - PHASE1_EPOCHS=20
      - PHASE2_EPOCHS=10
      - BATCH_SIZE=32
      - OVERSAMPLE_RATIO=0.25
      - CLASS_WEIGHT_MAL=1.2
      - FINE_TUNE_FROM_LAYER=300
      - PHASE1_LR=0.001
      - PHASE2_LR=0.0001
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - build_efficientnetB3
      - build_mlp

  # ─── BƯỚC 6: Đánh giá ───────────────────────────────────────────────
  evaluate:
    build: ./06_evaluate
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits:ro
      - data_output:/data/output:ro
      - data_eval:/data/eval
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - OUTPUT_DIR=/data/output
      - EVAL_DIR=/data/eval
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - train

  # ─── BƯỚC 7: XAI ────────────────────────────────────────────────────
  xai:
    build: ./07_xai
    volumes:
      - data_processed:/data/processed:ro
      - data_splits:/data/splits:ro
      - data_output:/data/output:ro
      - data_eval:/data/eval:ro
      - data_xai:/data/xai
    environment:
      - PROCESSED_DIR=/data/processed
      - SPLITS_DIR=/data/splits
      - OUTPUT_DIR=/data/output
      - EVAL_DIR=/data/eval
      - XAI_DIR=/data/xai
      - NUM_GRADCAM_SAMPLES=20
      - NUM_SHAP_SAMPLES=100
      - SHAP_BACKGROUND=50
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - evaluate

  # ─── DRIFT MONITOR (chạy liên tục) ──────────────────────────────────
  drift_monitor:
    build: ./drift_monitor
    volumes:
      - data_eval:/data/eval:ro
      - data_xai:/data/xai
    environment:
      - EVAL_DIR=/data/eval
      - PRODUCTION_LOG_DIR=/data/production_logs
      - DRIFT_REPORT_DIR=/data/xai/drift_reports
      - CHECK_INTERVAL_HOURS=24
      - PSI_THRESHOLD=0.25
      - KS_P_THRESHOLD=0.05
    restart: unless-stopped
