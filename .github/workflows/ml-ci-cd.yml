# ============================================================
# .github/workflows/ml-ci-cd.yml
# ============================================================
# CI/CD pipeline for ISIC 2024 Multimodal Skin Lesion Classifier
#
# Triggers
# ────────
#   push → main / develop
#   pull_request → main
#   workflow_dispatch (manual)
#
# Jobs
# ────
#   lint-test    – flake8 + pytest (unit + integration smoke)
#   build-images – Docker build for preprocessing / training / serving
#   push-images  – Push to GHCR on main branch
#   deploy-k8s   – Rolling update of serving deployment on main
# ============================================================

name: ISIC 2024 ML CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository_owner }}/isic2024

jobs:
  # ── 1. Lint + Unit Tests ──────────────────────────────────────────────────
  lint-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ MLflow_signature/ scripts/ \
            --max-line-length=120 \
            --ignore=E203,W503,E501

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run unit tests
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          pytest tests/test_data_preprocessing.py tests/test_model.py \
            -v --tb=short \
            --junitxml=test-results/unit.xml \
            -x

      - name: Run integration smoke test
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: |
          pytest tests/test_train.py \
            -v --tb=short \
            --junitxml=test-results/integration.xml \
            -x

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # ── 2. Build Docker Images ───────────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-test

    strategy:
      matrix:
        image:
          - name: preprocessing
            dockerfile: Docker/Dockerfile.preprocessing
          - name: training
            dockerfile: Docker/Dockerfile.training
          - name: serving
            dockerfile: Docker/Dockerfile.serving

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Push Docker Images (main only) ───────────────────────────────────
  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: preprocessing
            dockerfile: Docker/Dockerfile.preprocessing
          - name: training
            dockerfile: Docker/Dockerfile.training
          - name: serving
            dockerfile: Docker/Dockerfile.serving

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-${{ matrix.image.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Deploy to Kubernetes (main only) ─────────────────────────────────
  deploy-k8s:
    name: Deploy Serving to K8s
    runs-on: ubuntu-latest
    needs: push-images
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Set image SHA
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-serving:sha-${{ github.sha }}
          kubectl set image deployment/isic-serving \
            serving=${IMAGE_TAG} \
            -n isic2024

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/isic-serving \
            -n isic2024 \
            --timeout=300s

      - name: Verify health
        run: |
          SERVING_IP=$(kubectl get svc serving-svc -n isic2024 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -f http://${SERVING_IP}/health
