name: ML CI/CD Pipeline – ISIC 2024 Multimodal

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_training:
        description: "Trigger full model training"
        required: false
        default: "false"
        type: boolean

env:
  PYTHON_VERSION: "3.11"
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  TRAINING_IMAGE: isic2024-training
  SERVING_IMAGE: isic2024-serving

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Lint & static analysis
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install flake8 black isort mypy

      - name: Black format check
        run: black --check --diff .

      - name: Flake8 lint
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,.venv

      - name: isort import order
        run: isort --check-only --diff .

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Unit & integration tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Multimodal/requirement.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=Multimodal \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build Docker images
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.training
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.TRAINING_IMAGE }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.TRAINING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serving
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.SERVING_IMAGE }}:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.SERVING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Model training (manual trigger or push to main with input flag)
  # ────────────────────────────────────────────────────────────────────────────
  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_training == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r Multimodal/requirement.txt

      - name: Run training pipeline (no-mlflow mode for CI)
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_train.py \
            --config Multimodal/config/train_config.yaml \
            --no-mlflow

      - name: Upload model checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: model-checkpoint-${{ github.sha }}
          path: Multimodal/final/
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Deploy serving (only on main branch after build succeeds)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy Serving API
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Update serving image tag in k8s manifest
        run: |
          sed -i "s|isic2024-serving:latest|${{ env.IMAGE_REGISTRY }}/${{ env.SERVING_IMAGE }}:${{ github.sha }}|g" \
            docker/mflow/k8s-mflow.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f docker/mflow/k8s-mflow.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/isic2024-serving \
            -n mlops-isic2024 --timeout=300s

      - name: Smoke test serving endpoint
        run: |
          SVC_IP=$(kubectl get svc isic2024-serving-service \
            -n mlops-isic2024 \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl --fail --silent "http://${SVC_IP}/health" | jq .
