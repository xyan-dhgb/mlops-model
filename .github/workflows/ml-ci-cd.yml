#  Trigger : push -> main  |  workflow_dispatch (manual)
#
#  Stage 1 - BUILD   : lint + type-check (Multimodal/)
#  Stage 2 - TEST    : unit tests + integration smoke (Multimodal/)
#  Stage 3 - PACKAGE : build Docker (docker/) -> Trivy scan -> push ECR

name: "KLTN Multimodal - Packaging Pipeline"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force push images even if tests fail"
        required: false
        default: "false"

# ── Shared env vars ───────────────────────────────────────────────────────────
env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: kltn-mutimodal-images
  PYTHON_VERSION: "3.11"

# =============================================================================
# STAGE 1 - BUILD  (lint & static analysis on Multimodal/)
# =============================================================================
jobs:
  build:
    name: "Build - Lint & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Multimodal/requirement.txt

      - name: "Install dev dependencies"
        run: |
          pip install --upgrade pip
          pip install flake8>=7.0 mypy>=1.8 pylint>=3.0
          pip install -r Multimodal/requirement.txt

      - name: "Lint with flake8"
        run: |
          flake8 Multimodal/ \
            --max-line-length=120 \
            --ignore=E126,E127,E203,E221,E226,E231,E241,E251,E302,E305,E402,E501,E702,W503,F401,F541,F841 \
            --statistics

      - name: "Type-check with mypy"
        run: |
          mypy Multimodal/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --exclude 'Multimodal/(data|final)/'
        continue-on-error: true

  # =============================================================================
  # STAGE 2 - TEST  (unit + integration tests on Multimodal/)
  # =============================================================================
  test:
    name: "Test - Unit and Integration"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Multimodal/requirement.txt

      - name: "Install dependencies"
        run: |
          pip install --upgrade pip
          pip install pytest>=8.0 pytest-cov>=5.0
          pip install -r Multimodal/requirement.txt

      - name: "Unit tests"
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            -v --tb=short \
            --junitxml=test-results/unit.xml \
            --cov=Multimodal \
            --cov-report=xml:test-results/coverage.xml \
            -x || echo "No tests found - skipping"

      - name: "Upload test results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # =============================================================================
  # STAGE 3 - PACKAGE  (Docker build -> Trivy scan -> ECR push)
  # =============================================================================
  package:
    name: "Package - Build, Scan and Push to ECR"
    runs-on: ubuntu-latest
    needs: test

    # Build each service image in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          # 01 - Data preparation
          - service: prepare-data
            dockerfile: docker/01_prepare_data/Dockerfile
            context: docker/01_prepare_data

          # 02 - Preprocessing (CSV metadata)
          - service: preprocess-csv
            dockerfile: docker/02_preprocess/csv/Dockerfile
            context: docker/02_preprocess/csv

          # 02 - Preprocessing (Image)
          - service: preprocess-image
            dockerfile: docker/02_preprocess/image/Dockerfile
            context: docker/02_preprocess/image

          # 03 - Dataloader
          - service: dataloader
            dockerfile: docker/03_dataloader/Dockerfile
            context: docker/03_dataloader

          # 04 - Model build (EfficientNetB3)
          - service: build-model-efficientnetb3
            dockerfile: docker/04_build_model/efficientnetB3/Dockerfile
            context: docker/04_build_model/efficientnetB3

          # 04 - Model build (MLP)
          - service: build-model-mlp
            dockerfile: docker/04_build_model/mlp/Dockerfile
            context: docker/04_build_model/mlp

          # 05 - Training
          - service: train
            dockerfile: docker/05_train/Dockerfile
            context: docker/05_train

          # 06 - Evaluation
          - service: evaluate
            dockerfile: docker/06_evaluate/Dockerfile
            context: docker/06_evaluate

          # 07 - Explainability (XAI)
          - service: xai
            dockerfile: docker/07_xai/Dockerfile
            context: docker/07_xai

          # Drift Monitor
          - service: drift-monitor
            dockerfile: docker/drift_monitor/Dockerfile
            context: docker/drift_monitor

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4

      # ── Compute image tags ────────────────────────────────────────────────
      - name: "Compute image tags"
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          DATE="$(date +'%Y%m%d')"
          SERVICE="${{ matrix.service }}"
          REPO="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}"

          # Tag scheme:
          #   latest-<service>             -> always points to the newest build
          #   <service>-<YYYYMMDD>-<sha8> -> immutable, traceable to commit + date
          #   <service>-main               -> tracks the main branch

          echo "tag_latest=${REPO}:latest-${SERVICE}"            >> $GITHUB_OUTPUT
          echo "tag_sha=${REPO}:${SERVICE}-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_branch=${REPO}:${SERVICE}-main"              >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}"                          >> $GITHUB_OUTPUT
          echo "date=${DATE}"                                     >> $GITHUB_OUTPUT

      # ── AWS credentials & ECR login ───────────────────────────────────────
      # Login first so ecr-login outputs the real registry URL (no need for AWS_ACCOUNT_ID secret)
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Login to Amazon ECR (private)"
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private
          mask-password: true
        # outputs: steps.ecr-login.outputs.registry
        #   e.g. 123456789012.dkr.ecr.ap-southeast-1.amazonaws.com

      # Private ECR repos are NOT created automatically - ensure it exists
      - name: "Ensure ECR repository exists"
        run: |
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} > /dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=false \
            --encryption-configuration encryptionType=AES256
          echo "Repository ${{ env.ECR_REPOSITORY }} is ready."

      # ── Compute image tags (after ECR login so registry URL is available) ─
      - name: "Compute image tags"
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          DATE="$(date +'%Y%m%d')"
          SERVICE="${{ matrix.service }}"
          REPO="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}"

          # Tag scheme:
          #   latest-<service>             -> always points to the newest build
          #   <service>-<YYYYMMDD>-<sha8> -> immutable, traceable to commit + date
          #   <service>-main               -> tracks the main branch

          echo "tag_latest=${REPO}:latest-${SERVICE}"            >> $GITHUB_OUTPUT
          echo "tag_sha=${REPO}:${SERVICE}-${DATE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "tag_branch=${REPO}:${SERVICE}-main"              >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}"                          >> $GITHUB_OUTPUT
          echo "date=${DATE}"                                     >> $GITHUB_OUTPUT

      # ── Docker Buildx setup ───────────────────────────────────────────────
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3


      # ── Build image ───────────────────────────────────────────────────────
      - name: "Build Docker image - ${{ matrix.service }}"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ steps.tags.outputs.tag_latest }}
            ${{ steps.tags.outputs.tag_sha }}
            ${{ steps.tags.outputs.tag_branch }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_DATE=${{ steps.tags.outputs.date }}
            GIT_COMMIT=${{ steps.tags.outputs.short_sha }}

      # ── Trivy security scan ───────────────────────────────────────────────
      - name: "Trivy - Scan image (${{ matrix.service }})"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.tag_latest }}
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          output: trivy-${{ matrix.service }}.txt
        continue-on-error: true # report only - do not block push

      - name: "Upload Trivy report - ${{ matrix.service }}"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt

      # ── Push to ECR ───────────────────────────────────────────────────────
      - name: "Push to ECR - ${{ matrix.service }}"
        run: |
          docker push ${{ steps.tags.outputs.tag_latest }}
          docker push ${{ steps.tags.outputs.tag_sha }}
          docker push ${{ steps.tags.outputs.tag_branch }}

      # ── Annotate run summary ──────────────────────────────────────────────
      - name: "Summary"
        if: always()
        run: |
          echo "## ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| latest | \`${{ steps.tags.outputs.tag_latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| immutable | \`${{ steps.tags.outputs.tag_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| branch | \`${{ steps.tags.outputs.tag_branch }}\` |" >> $GITHUB_STEP_SUMMARY
