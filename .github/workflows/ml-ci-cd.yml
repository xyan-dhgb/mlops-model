#  Trigger : push -> main  |  workflow_dispatch (manual)
#
#  Stage 1 - BUILD      : lint + type-check (Multimodal/)
#  Stage 2 - TEST       : unit tests + integration smoke (Multimodal/)
#  Stage 3 - SETUP-ECR  : get registry URL, ensure ECR repo exists  (runs once)
#  Stage 4 - PACKAGE    : build Docker (docker/) -> Trivy scan -> push ECR

name: "KLTN Multimodal - Packaging Pipeline"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force push images even if tests fail"
        required: false
        default: "false"

# ── Shared env vars ───────────────────────────────────────────────────────────
env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: kltn-mutimodal-images
  PYTHON_VERSION: "3.11"

# =============================================================================
# STAGE 1 - BUILD  (lint & static analysis on Multimodal/)
# =============================================================================
jobs:
  build:
    name: "Build - Lint & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Multimodal/requirement.txt

      - name: "Install dev dependencies"
        run: |
          pip install --upgrade pip
          pip install flake8>=7.0 mypy>=1.8 pylint>=3.0
          pip install -r Multimodal/requirement.txt

      - name: "Lint with flake8"
        run: |
          flake8 Multimodal/ \
            --max-line-length=120 \
            --ignore=E126,E127,E203,E221,E226,E231,E241,E251,E302,E305,E402,E501,E702,W503,F401,F541,F841 \
            --statistics

      - name: "Type-check with mypy"
        run: |
          mypy Multimodal/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --exclude 'Multimodal/(data|final)/'
        continue-on-error: true

  # =============================================================================
  # STAGE 2 - TEST  (unit + integration tests on Multimodal/)
  # =============================================================================
  test:
    name: "Test - Unit and Integration"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Multimodal/requirement.txt

      - name: "Install dependencies"
        run: |
          pip install --upgrade pip
          pip install pytest>=8.0 pytest-cov>=5.0
          pip install -r Multimodal/requirement.txt

      - name: "Unit tests"
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            -v --tb=short \
            --junitxml=test-results/unit.xml \
            --cov=Multimodal \
            --cov-report=xml:test-results/coverage.xml \
            -x || echo "No tests found - skipping"

      - name: "Upload test results"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

  # =============================================================================
  # STAGE 3 - SETUP-ECR  (runs ONCE before the matrix)
  #   - Derives ECR registry URL from AWS CLI (no AWS_ACCOUNT_ID secret needed)
  #   - Ensures ECR repository exists
  #   - Passes registry URL to the package matrix via job output
  # =============================================================================
  setup-ecr:
    name: "Setup ECR"
    runs-on: ubuntu-latest
    needs: test

    outputs:
      registry: ${{ steps.get-registry.outputs.registry }}

    steps:
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Get ECR registry URL & ensure repo exists"
        id: get-registry
        run: |
          # Derive registry URL from the caller identity — no secret needed
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT
          echo "✅ Registry: ${REGISTRY}"

          # Ensure the ECR repo exists (only needs to happen once)
          aws ecr describe-repositories \
            --repository-names ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} > /dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=false \
            --encryption-configuration encryptionType=AES256
          echo "✅ Repository ${{ env.ECR_REPOSITORY }} is ready."

  # =============================================================================
  # STAGE 4 - PACKAGE  (Docker build -> Trivy scan -> ECR push)
  # =============================================================================
  package:
    name: "Package - ${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: [test, setup-ecr]

    # Build each service image - max 3 at once to avoid ECR connection saturation
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # 01 - Data preparation
          - service: prepare-data
            dockerfile: docker/01_prepare_data/Dockerfile
            context: .

          # 02 - Preprocessing (CSV metadata)
          - service: preprocess-csv
            dockerfile: docker/02_preprocess/csv/Dockerfile
            context: .

          # 02 - Preprocessing (Image)
          - service: preprocess-image
            dockerfile: docker/02_preprocess/image/Dockerfile
            context: .

          # 03 - Dataloader
          - service: dataloader
            dockerfile: docker/03_dataloader/Dockerfile
            context: .

          # 04 - Model build (EfficientNetB3)
          - service: build-model-efficientnetb3
            dockerfile: docker/04_build_model/efficientnetB3/Dockerfile
            context: .

          # 04 - Model build (MLP)
          - service: build-model-mlp
            dockerfile: docker/04_build_model/mlp/Dockerfile
            context: .

          # 05 - Training
          - service: train
            dockerfile: docker/05_train/Dockerfile
            context: .

          # 06 - Evaluation
          - service: evaluate
            dockerfile: docker/06_evaluate/Dockerfile
            context: .

          # 07 - Explainability (XAI)
          - service: xai
            dockerfile: docker/07_xai/Dockerfile
            context: .

          # Drift Monitor
          - service: drift-monitor
            dockerfile: docker/drift_monitor/Dockerfile
            context: .

    steps:
      - name: "Checkout source"
        uses: actions/checkout@v4

      # ── AWS credentials ────────────────────────────────────────────────────
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Login to ECR (registry URL already resolved by setup-ecr job) ─────
      - name: "Login to Amazon ECR"
        run: |
          REGISTRY="${{ needs.setup-ecr.outputs.registry }}"
          echo "Logging in to ${REGISTRY}..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin "${REGISTRY}"
          echo "✅ Logged in to ${REGISTRY}"

      # ── Compute image tag (timestamp: YYYYMMDD-HHMM) ──────────────────────
      - name: "Compute image tag"
        id: tags
        run: |
          REGISTRY="${{ needs.setup-ecr.outputs.registry }}"
          TIMESTAMP="$(date +'%Y%m%d-%H%M')"
          SHORT_TAG="${{ matrix.service }}-${TIMESTAMP}"
          echo "tag=${REGISTRY}/${{ env.ECR_REPOSITORY }}:${SHORT_TAG}" >> $GITHUB_OUTPUT
          echo "short_tag=${SHORT_TAG}" >> $GITHUB_OUTPUT

      # ── Docker Buildx setup ───────────────────────────────────────────────
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ── Build & push image directly to ECR ────────────────────────────────
      - name: "Build & Push - ${{ matrix.service }}"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tag }}
          platforms: linux/amd64
          provenance: false # disable SLSA attestation → plain Image, not Image Index
          sbom: false # disable SBOM attestation for same reason
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # ── Trivy security scan (from ECR after push) ─────────────────────────
      - name: "Trivy - Scan image (${{ matrix.service }})"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tags.outputs.tag }}
          format: table
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          output: trivy-${{ matrix.service }}.txt
        continue-on-error: true # report only - do not block

      - name: "Upload Trivy report - ${{ matrix.service }}"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt

      # ── Annotate run summary ──────────────────────────────────────────────
      - name: "Summary"
        if: always()
        run: |
          echo "## ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "| Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ steps.tags.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY

      # ── Save short tag as artifact for update-gitops job ─────────────────
      - name: "Save image tag artifact"
        if: success()
        run: echo "${{ steps.tags.outputs.short_tag }}" > "${{ matrix.service }}.txt"

      - name: "Upload image tag artifact"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: image-tag-${{ matrix.service }}
          path: ${{ matrix.service }}.txt

  # =============================================================================
  # STAGE 5 - UPDATE-GITOPS  (commit new image tags to mlops-infr/values.yaml)
  # =============================================================================
  update-gitops:
    name: "Update GitOps - values.yaml"
    runs-on: ubuntu-latest
    needs: package
    if: success()

    steps:
      - name: "Checkout mlops-infr repo"
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}   # e.g. xyan-dhgb/mlops-infrastructure
          token: ${{ secrets.GITOPS_PAT }}
          path: mlops-infr

      - name: "Download all image tag artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: image-tag-*
          path: image-tags/
          merge-multiple: true

      - name: "Update values.yaml with new image tags"
        run: |
          python3 << 'EOF'
          import re, os, sys

          VALUES_PATH = 'mlops-infr/gitops/mlops-pipeline/isic/values.yaml'

          # service name (ECR tag prefix) → Helm values.yaml key
          KEY_MAP = {
              'prepare-data':               'prepareData',
              'preprocess-csv':             'preprocessCsv',
              'preprocess-image':           'preprocessImage',
              'dataloader':                 'dataloader',
              'build-model-efficientnetb3': 'buildEfficientnetb3',
              'build-model-mlp':            'buildMlp',
              'train':                      'train',
              'evaluate':                   'evaluate',
              'xai':                        'xai',
              'drift-monitor':              'driftMonitor',
          }

          with open(VALUES_PATH, 'r') as f:
              content = f.read()

          for service, yaml_key in KEY_MAP.items():
              tag_file = f'image-tags/{service}.txt'
              if not os.path.exists(tag_file):
                  print(f'⚠️  Missing tag file for {service} — skipping')
                  continue
              with open(tag_file) as tf:
                  tag = tf.read().strip()
              content, n = re.subn(
                  rf'({re.escape(yaml_key)}:\s+)"[^"]*"',
                  rf'\1"{tag}"',
                  content
              )
              if n:
                  print(f'✅  {yaml_key}: {tag}')
              else:
                  print(f'⚠️  Key not found in values.yaml: {yaml_key}', file=sys.stderr)

          with open(VALUES_PATH, 'w') as f:
              f.write(content)

          print('\n✅ values.yaml updated.')
          EOF

      - name: "Commit and push to mlops-infr"
        run: |
          cd mlops-infr
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "ℹ️  No changes to values.yaml — nothing to commit."
            exit 0
          fi
          git add gitops/mlops-pipeline/isic/values.yaml
          git commit -m "chore(gitops): update ISIC image tags $(date +'%Y%m%d-%H%M') [skip ci]"
          git push
          echo "✅ values.yaml committed and pushed."
