# =============================================================================
# train_config.yaml — ISIC 2024 Skin Cancer Detection with 3D-TBP
# Mô hình : EfficientNet-B3 (ảnh HDF5) + MetadataMLP 9-dim — Late Fusion
# Task    : Binary classification (malignant=1 / benign=0)
# Dataset : ~400.000 ảnh TBP crops, malignant ~3%
#
# Cách dùng:
#   python scripts/run_train.py --config Multimodal/config/train_config.yaml
#   python scripts/run_train.py --config Multimodal/config/train_config.yaml --fold 1
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# MLflow
# ─────────────────────────────────────────────────────────────────────────────
experiment_name: "multimodal_skin_cancer_isic2024"
run_name: "efficientnet_b3_binary"   # scripts/run_train.py tự gắn _fold{N}

# URI MLflow tracking server
# - Local (docker-compose)       : "http://localhost:5000"
# - EKS (trong cluster)          : "http://mlflow-service.mlops.svc.cluster.local:5000"
# - EKS (kubectl port-forward)   : "http://localhost:5000"
mlflow_tracking_uri: "http://localhost:5000"


# ─────────────────────────────────────────────────────────────────────────────
# Dữ liệu — ISIC 2024 (khác hoàn toàn với ISIC 2019)
# ─────────────────────────────────────────────────────────────────────────────

# File CSV metadata ISIC 2024
csv_path: "Multimodal/data/raw/train-metadata.csv"

# File HDF5 chứa toàn bộ ảnh — ISIC 2024 không dùng thư mục .jpg
# Dùng image_256sq.hdf5 nếu muốn tiết kiệm RAM (ảnh đã resize 256x256)
hdf5_path: "Multimodal/data/raw/train-image.hdf5"

# Fold kiểm định (0–4) trong 5-fold StratifiedGroupKFold theo patient_id
# Ghi đè từ CLI: --fold 1
fold: 0

# Đường dẫn preprocessor đã fit sẵn
# null  = fit preprocessor mới trên train split của fold hiện tại
# path  = dùng lại preprocessor từ fold 0 cho fold 1–4
preprocessor_path: null


# ─────────────────────────────────────────────────────────────────────────────
# Tiền xử lý ảnh
# ─────────────────────────────────────────────────────────────────────────────
image_size: 224

# TBP crops ít lông hơn dermoscopy → tắt hair removal mặc định
apply_hair_removal: false

# Vẫn hữu ích cho TBP vì ảnh chụp từ nhiều thiết bị khác nhau
apply_color_constancy: true


# ─────────────────────────────────────────────────────────────────────────────
# DataLoader
# ─────────────────────────────────────────────────────────────────────────────

# Gợi ý theo GPU: A100=128, RTX3090=64, T4(Colab/EKS)=32, CPU=8
batch_size: 32

# 0 = main process (dùng khi debug HDF5 multiprocessing issue)
num_workers: 4

# Bắt buộc bật vì malignant chỉ ~3% — rất mất cân bằng
use_weighted_sampler: true


# ─────────────────────────────────────────────────────────────────────────────
# Siêu tham số huấn luyện
# ─────────────────────────────────────────────────────────────────────────────
num_epochs: 30
lr: 0.0001
weight_decay: 0.0001

# Focal Loss — gamma=2.0 theo RetinaNet, alpha=0.25 cho lớp dương tính
gamma_focal: 2.0
focal_alpha: 0.25

# T_max cho CosineAnnealingLR
scheduler_t_max: 30

# Gradient clipping
grad_clip_norm: 1.0


# ─────────────────────────────────────────────────────────────────────────────
# Kiến trúc mô hình
# ─────────────────────────────────────────────────────────────────────────────

# ISIC 2024: binary task → num_classes = 1 (logit đơn + BCEWithLogitsLoss)
num_classes: 1

# ISIC 2024: 9 features
# [age, is_male, high_risk_site, age_bucket, site_encoded,
#  tbp_nevi_confidence, tbp_color_asymmetry, tbp_size_mm2_norm, tbp_border_color_score]
metadata_input_dim: 9

pretrained: true
freeze_bn: false


# ─────────────────────────────────────────────────────────────────────────────
# Phần cứng
# ─────────────────────────────────────────────────────────────────────────────
device: "cuda"
use_amp: true


# ─────────────────────────────────────────────────────────────────────────────
# Checkpoint & metric
# ─────────────────────────────────────────────────────────────────────────────
save_dir: "Multimodal/final"

# ISIC 2024 metric chính: pAUC tại TPR ≥ 80%
# Lựa chọn khác: "val/auc_roc" | "val/balanced_accuracy" | "val/f1_binary"
best_metric: "val/pauc"

# Ngưỡng TPR tối thiểu cho pAUC (theo đặc tả Kaggle ISIC 2024)
pauc_min_tpr: 0.80


# ─────────────────────────────────────────────────────────────────────────────
# Pipeline đầy đủ — dùng với --full-pipeline
# ─────────────────────────────────────────────────────────────────────────────
preprocess_output: "outputs/preprocessing"

# SHA-256 manifest — null = bỏ qua (bật khi cần SecMLOps hash validation)
hash_manifest: null

# ISIC 2024 dùng StratifiedGroupKFold theo patient_id
n_folds: 5
seed: 42


# ─────────────────────────────────────────────────────────────────────────────
# XAI
# ─────────────────────────────────────────────────────────────────────────────
generate_xrai: false
generate_shap: false
shap_top_k: 3
xrai_fast_mode: true
