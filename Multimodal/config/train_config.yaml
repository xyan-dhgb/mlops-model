# ============================================================
# ISIC 2024 Multimodal Training Configuration
# ============================================================

data:
  csv_path: "Multimodal/data/raw/train-metadata.csv"
  hdf5_path: "Multimodal/data/raw/train-image.hdf5"
  image_dir: "Multimodal/data/raw/images"
  max_images: 5000          # null = extract all from HDF5

preprocessing:
  image_size: [224, 224]
  apply_clahe: true
  apply_gaussian: true
  enhance_contrast: 1.2
  augmentation:
    rotation_range: 15
    brightness_range: [0.8, 1.2]
    zoom_range: 0.1
    horizontal_flip: true

split:
  test_size: 0.20
  val_size: 0.20
  random_state: 42
  stratify: true

model:
  image_shape: [224, 224, 3]
  num_classes: 2            # Binary: 0=Benign, 1=Malignant

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0001
  use_class_weights: true   # Handles class imbalance
  callbacks:
    early_stopping:
      monitor: val_auc
      patience: 5
      mode: max
    reduce_lr:
      monitor: val_loss
      factor: 0.5
      patience: 3
      min_lr: 0.000001
    checkpoint:
      monitor: val_auc
      mode: max

output:
  checkpoint_path: "Multimodal/final/best_model.h5"
  preprocessor_path: "Multimodal/final/preprocessor.pkl"
  mlflow_experiment: "ISIC2024_Multimodal"
  mlflow_tracking_uri: "http://localhost:5000"

xai:
  enabled: true
  last_conv_layer: "conv2d_2"   # Last Conv2D layer name in CNN branch
  shap_background_samples: 100
  gradcam_samples: 3
